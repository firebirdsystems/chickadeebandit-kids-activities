<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids' Activities</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 10px);
      --green: #047857; --green-soft: #d1fae5;
      --amber: var(--hub-tint-warning-fg, #b45309); --amber-soft: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #b91c1c); --red-soft: var(--hub-tint-danger, #fee2e2);
      --blue: var(--hub-tint-info-fg, #1d4ed8); --blue-soft: var(--hub-tint-info, #dbeafe);
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: .95rem; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: rgba(127,127,127,.08); }
    .btn-danger { background: var(--red-soft); color: var(--red); }
    .btn-sm { min-height: 31px; padding: 5px 10px; font-size: .78rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab {
      border: 1px solid var(--border-mid); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 5px 13px; font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 2px 8px; }
    .row {
      display: flex; align-items: center; gap: 11px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .row-icon { font-size: 1.15rem; width: 30px; text-align: center; flex-shrink: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-weight: 750; font-size: .92rem; }
    .row-meta { color: var(--muted); font-size: .78rem; }
    .row-side { flex-shrink: 0; text-align: right; display: grid; gap: 3px; justify-items: end; }
    .pill {
      display: inline-flex; align-items: center; min-height: 20px; padding: 1px 8px;
      border-radius: 999px; white-space: nowrap; background: var(--bg); color: var(--muted);
      font-size: .72rem; font-weight: 800;
    }
    .pill.today { background: var(--red-soft); color: var(--red); }
    .pill.week { background: var(--amber-soft); color: var(--amber); }
    .pill.game { background: var(--blue-soft); color: var(--blue); }
    .edit-link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .76rem; font-weight: 700; padding: 2px 4px; }
    .edit-link:hover { color: var(--text); text-decoration: underline; }
    .gear-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .gear-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
      background: var(--surface); border: 1px solid var(--border-mid); border-radius: 999px;
      font-size: .8rem; font-weight: 600;
    }
    .gear-chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .8rem; padding: 0 1px; }
    .empty { color: var(--muted); text-align: center; padding: 30px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 470px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 92vh; overflow-y: auto; }
    .modal h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    input, select, textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 56px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
    .modal-left { margin-right: auto; }
    .inline-add { display: flex; gap: 6px; }
    .inline-add input { flex: 1; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/kids-activities/">
</head>
<body>
<div class="app">
  <div id="root" class="empty">Loading…</div>
</div>

<script type="module">
import {
  esc, isAdult, hubConfirm, searchMatch, glyph, chickadee,
  createShareHelper, activeShareLinks, SHARE_CALENDAR_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS,
} from "/hub-sdk.js";
import {
  SESSION_KINDS, sessionKindMeta, upcomingSessions,
  sessionDayLabel, fmtTimeRange, sortedActivities, isoDay, searchableFields,
  buildCalendarEvents, failureLine, outcomeUnknown, storedDiffers, SAVED_AS_FIRST,
} from "./logic.js";
import { createShareUi, createOverlayView } from "./share.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const EVENTS = window.__EVENTS_URL ?? "";
const STORE_URL = window.__STORE_URL ?? "";
const IS_ADMIN = window.__IS_ADMIN === true;

// External share links (manifest.shareable.activity). The hub injects the URLs
// only when the manifest declares `shareable`, and mints for adults only;
// whether this household or space allows it at all is answered by the panel's
// first read, which it reports rather than guessing here.
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const CAN_SHARE = share.enabled && !!HUB_MEMBER && isAdult(HUB_MEMBER);
const shareView = createOverlayView(document);
const shareUi = createShareUi({
  share,
  itemType: "activity",
  noun: "activity",
  scopeHtml: () => "The page shows the activity’s name, season and usual location, the gear list, and every session with its date, time and place, latest date first. The calendar link carries the same sessions, from a month ago onward. Which child it’s for, the coach’s details and your notes stay in the household. Anyone who gets the link can read it.",
  esc,
  glyph,
  confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
  writeText: (text) => navigator.clipboard.writeText(text),
  activeLinks: activeShareLinks,
  // A season outlasts a month, and a calendar subscription stops updating when
  // its link expires, so this item type offers the longer choices.
  expiryChoices: SHARE_CALENDAR_EXPIRY_CHOICES,
  defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
  calendarUrl: (link) => share.calendarUrl(link),
  getMe: () => HUB_MEMBER,
  isAdmin: () => IS_ADMIN,
  memberName: (id) => memberMap.get(id)?.name ?? "",
  view: shareView,
});
shareView.bind(shareUi);

async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // The row is already written; a failed publish is not fatal.
  }
}

let members = [];
let memberMap = new Map();
let me = null;
let activities = [];
let sessions = [];
let gear = [];
let currentActivityId = "all";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let error = "";
let loadFailed = false; // first load failed; cleared when a load succeeds
let modalEl = null;

function nowIso() { return new Date().toISOString(); }
function canManage() { return !!me && isAdult(me); }
function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }

/* ── DB helper ─────────────────────────────────────────────────────────────── */
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) {
    throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status, code: json?.code });
  }
  return json;
}

/* ── Loading ───────────────────────────────────────────────────────────────── */
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
      { id: "demo-4", name: "Riley", role: "child" },
    ];
  } else {
    // A failed read is a failed load, never an empty household.
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || typeof data !== "object" || (Array.isArray(data.$errors) && data.$errors.includes("family.members"))) throw new Error("Couldn’t load members");
    members = data["family.members"] ?? [];
  }
  memberMap = new Map(members.map((m) => [m.id, m]));
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function loadData() {
  if (!DB) {
    const day = (offset) => isoDay(new Date(Date.now() + offset * 86400000));
    activities = [
      { id: "a1", member_id: "demo-3", name: "U10 Soccer", season: "Fall 2026", location: "Miller Park", coach_name: "Coach Dana", coach_contact: "555-0182", notes: "", emoji: "⚽", archived: 0, created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
      { id: "a2", member_id: "demo-4", name: "Piano", season: "", location: "Ms. Lee's studio", coach_name: "Ms. Lee", coach_contact: "", notes: "", emoji: "🎹", archived: 0, created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
    ];
    sessions = [
      { id: "s1", activity_id: "a1", kind: "practice", session_date: day(1), start_time: "17:30", end_time: "18:45", location: "", notes: "", created_by: "demo-1", created_at: nowIso() },
      { id: "s2", activity_id: "a1", kind: "game", session_date: day(5), start_time: "09:00", end_time: "10:30", location: "Riverside Field 2", notes: "Wear white", created_by: "demo-1", created_at: nowIso() },
      { id: "s3", activity_id: "a2", kind: "rehearsal", session_date: day(2), start_time: "16:00", end_time: "16:30", location: "", notes: "", created_by: "demo-1", created_at: nowIso() },
    ];
    gear = [
      { id: "g1", activity_id: "a1", name: "Shin guards", sort_order: 0, created_by: "demo-1", created_at: nowIso() },
      { id: "g2", activity_id: "a1", name: "Water bottle", sort_order: 1, created_by: "demo-1", created_at: nowIso() },
    ];
    return;
  }
  const [a, s, g] = await Promise.all([
    db("SELECT id, member_id, name, season, location, coach_name, coach_contact, notes, emoji, archived, created_by, created_at, updated_at FROM app_kids_activities__activities WHERE archived = 0 ORDER BY created_at"),
    db("SELECT id, activity_id, kind, session_date, start_time, end_time, location, notes, created_by, created_at FROM app_kids_activities__sessions ORDER BY session_date, start_time LIMIT 600"),
    db("SELECT g.id, g.activity_id, g.name, g.sort_order, g.created_by, g.created_at FROM app_kids_activities__gear g JOIN app_kids_activities__activities a ON a.id = g.activity_id AND a.archived = 0 ORDER BY g.sort_order, g.created_at"),
  ]);
  activities = a.rows ?? [];
  sessions = s.rows ?? [];
  gear = g.rows ?? [];
}

async function refresh() {
  error = "";
  try {
    await Promise.all([loadMembers(), loadData()]);
    loadFailed = false;
    if (currentActivityId !== "all" && !activities.some((a) => a.id === currentActivityId)) currentActivityId = "all";
    render();
  } catch { loadFailed = true; render(); }
}

function showError(msg) { error = msg; render(); }

// A write that changed nothing: re-read, then say whether the row is gone or
// still there. Every caller's write is a plain `WHERE id = ?`, so a row still
// there means the hub's row policy refused it. A failed re-read can say
// neither, so it asks for a retry.
async function staleWrite(stillThere) {
  await refresh();
  return Object.assign(new Error("write changed nothing"), loadFailed ? {} : { outcome: stillThere() ? "refused" : "removed" });
}

/**
 * Republish the `calendar_events` export so the season shows up on the
 * household calendar and in the ICS feed. Best-effort and never awaited by a
 * caller's error path: a failed sync must not roll back a session the user
 * just saved, and the next mutation republishes the whole payload anyway.
 */
async function syncCalendar() {
  if (!STORE_URL || !DB) return;
  const events = buildCalendarEvents(activities, sessions, isoDay(new Date()));
  await fetch(STORE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: "calendar_events", value: JSON.stringify(events) }),
  }).catch(() => {});
}

/**
 * Retry after a lost response: a create whose answer leaves the outcome
 * unknown is read back by its pinned id. Returns the stored row when an
 * earlier try landed; otherwise rethrows the write's error (the id stays
 * pinned for the next press).
 */
async function landedUnheard(e, table, cols, id) {
  if (!DB || !outcomeUnknown(e)) throw e;
  let stored = null;
  try { stored = (await db(`SELECT ${cols} FROM ${table} WHERE id = ?`, [id])).rows?.[0] ?? null; }
  catch (readErr) { console.error(readErr); }
  if (!stored) throw e;
  console.error(e);
  return stored;
}

/* ── Mutations ─────────────────────────────────────────────────────────────── */
// saveActivity and saveSession send the write before anything is drawn: the
// form stays open until the hub has the row, and a refused write throws to the
// form's submit handler, which says so there and leaves what was typed in place.
// A create's id is the form's (`pinHost`), minted on its first Save and sent on
// every retry: a try whose answer was lost may have stored the row, and a
// second press must find that row rather than add another.
async function saveActivity(fields, existingId, pinHost = null) {
  const now = nowIso();
  if (existingId) {
    const res = await db("UPDATE app_kids_activities__activities SET member_id=?, name=?, season=?, location=?, coach_name=?, coach_contact=?, notes=?, emoji=?, updated_at=? WHERE id=?",
      [fields.member_id, fields.name, fields.season, fields.location, fields.coach_name, fields.coach_contact, fields.notes, fields.emoji, now, existingId]);
    // The hub answers 200 with changed: 0 for a write it narrowed: nothing was saved.
    if (res.changed === 0) throw await staleWrite(() => activities.some((a) => a.id === existingId));
    const idx = activities.findIndex((a) => a.id === existingId);
    if (idx !== -1) activities[idx] = { ...activities[idx], ...fields, updated_at: now };
    closeModal(); render();
    syncCalendar();
  } else {
    const id = pinHost ? (pinHost.rowId ??= crypto.randomUUID()) : crypto.randomUUID();
    let row = { id, ...fields, archived: 0, created_by: me.id, created_at: now, updated_at: now };
    let note = "";
    try {
      await db("INSERT INTO app_kids_activities__activities (id, member_id, name, season, location, coach_name, coach_contact, notes, emoji, archived, created_by, created_at, updated_at) VALUES (?,?,?,?,?,?,?,?,?,0,?,?,?)",
        [row.id, row.member_id, row.name, row.season, row.location, row.coach_name, row.coach_contact, row.notes, row.emoji, row.created_by, now, now]);
    } catch (e) {
      // Found: an earlier try landed and its success path runs now, once.
      row = await landedUnheard(e, "app_kids_activities__activities", "id, member_id, name, season, location, coach_name, coach_contact, notes, emoji, archived, created_by, created_at, updated_at", id);
      // Edited since that first try: what was stored is kept, and said so.
      if (storedDiffers(row, fields)) note = SAVED_AS_FIRST;
    }
    if (pinHost) delete pinHost.rowId;
    activities = [...activities.filter((a) => a.id !== row.id), row];
    currentActivityId = row.id;
    error = note;
    closeModal(); render();
    // The SEASON is the event, not the sessions: adding a practice is
    // routine schedule upkeep and a season's worth of them lands in one go.
    publishEvent("kids_activity.season_started", row.id, {
      name: row.name,
      season: row.season,
      member_id: row.member_id,
    });
    syncCalendar();
  }
}

async function archiveActivity(id) {
  const ok = await hubConfirm({ message: "Archive this activity?", description: "Season over? The schedule and gear list go with it.", confirmLabel: "Archive", destructive: true });
  if (!ok) return;
  const prev = activities;
  activities = activities.filter((a) => a.id !== id);
  if (currentActivityId === id) currentActivityId = "all";
  closeModal(); render();
  try {
    const res = await db("UPDATE app_kids_activities__activities SET archived = 1 WHERE id = ?", [id]);
    if (res.changed === 0) { const e = await staleWrite(() => activities.some((a) => a.id === id)); console.error(e); showError(failureLine(e, { action: "archive the activity", thing: "activity" })); return; }
    syncCalendar();
  } catch (e) { console.error(e); activities = prev; showError(failureLine(e, { action: "archive the activity", thing: "activity" })); }
}

async function saveSession(fields, existingId, pinHost = null) {
  const now = nowIso();
  let note = "";
  if (existingId) {
    const res = await db("UPDATE app_kids_activities__sessions SET activity_id=?, kind=?, session_date=?, start_time=?, end_time=?, location=?, notes=? WHERE id=?",
      [fields.activity_id, fields.kind, fields.session_date, fields.start_time, fields.end_time, fields.location, fields.notes, existingId]);
    if (res.changed === 0) throw await staleWrite(() => sessions.some((s) => s.id === existingId));
    const idx = sessions.findIndex((s) => s.id === existingId);
    if (idx !== -1) sessions[idx] = { ...sessions[idx], ...fields };
  } else {
    const id = pinHost ? (pinHost.rowId ??= crypto.randomUUID()) : crypto.randomUUID();
    let row = { id, ...fields, created_by: me.id, created_at: now };
    try {
      await db("INSERT INTO app_kids_activities__sessions (id, activity_id, kind, session_date, start_time, end_time, location, notes, created_by, created_at) VALUES (?,?,?,?,?,?,?,?,?,?)",
        [row.id, row.activity_id, row.kind, row.session_date, row.start_time, row.end_time, row.location, row.notes, row.created_by, now]);
    } catch (e) {
      row = await landedUnheard(e, "app_kids_activities__sessions", "id, activity_id, kind, session_date, start_time, end_time, location, notes, created_by, created_at", id);
      if (storedDiffers(row, fields)) note = SAVED_AS_FIRST;
    }
    if (pinHost) delete pinHost.rowId;
    sessions = [...sessions.filter((s) => s.id !== row.id), row];
  }
  error = note;
  closeModal(); render();
  syncCalendar();
}

async function deleteSession(id) {
  const ok = await hubConfirm({ message: "Delete this session?", confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  const prev = sessions;
  sessions = sessions.filter((s) => s.id !== id);
  closeModal(); render();
  try {
    const res = await db("DELETE FROM app_kids_activities__sessions WHERE id = ?", [id]);
    if (res.changed === 0) { const e = await staleWrite(() => sessions.some((s) => s.id === id)); console.error(e); showError(failureLine(e, { action: "delete the session", thing: "session" })); return; }
    syncCalendar();
  } catch (e) { console.error(e); sessions = prev; showError(failureLine(e, { action: "delete the session", thing: "session" })); }
}

// A gear add's id, pinned by activity and name until its outcome is known: the
// failed word is put back in the field, and sending it again must find a row
// an earlier try stored rather than add a second chip.
const gearPins = new Map();

async function addGear(activityId, name) {
  const pinKey = `${activityId}|${name}`;
  const id = gearPins.get(pinKey) ?? crypto.randomUUID();
  gearPins.set(pinKey, id);
  const row = { id, activity_id: activityId, name, sort_order: gear.filter((g) => g.activity_id === activityId).length, created_by: me.id, created_at: nowIso() };
  gear = [...gear.filter((g) => g.id !== id), row];
  render();
  try {
    await db("INSERT INTO app_kids_activities__gear (id, activity_id, name, sort_order, created_by, created_at) VALUES (?,?,?,?,?,?)",
      [row.id, row.activity_id, row.name, row.sort_order, row.created_by, row.created_at]);
    gearPins.delete(pinKey);
  } catch (e) {
    // An earlier try that landed: the chip stays, as stored.
    const stored = await landedUnheard(e, "app_kids_activities__gear", "id, activity_id, name, sort_order, created_by, created_at", id).catch(() => null);
    if (stored) { gearPins.delete(pinKey); gear = gear.map((g) => (g.id === id ? stored : g)); render(); return; }
    // A refusal the hub named stored nothing: the next try may mint afresh.
    if (!outcomeUnknown(e)) gearPins.delete(pinKey);
    console.error(e);
    gear = gear.filter((g) => g.id !== row.id);
    showError(failureLine(e, { action: "add that", thing: "gear item" }));
    // The field was cleared when the chip was drawn: put the word back to send again.
    const input = document.getElementById("gear-name");
    if (input && !input.value) input.value = name;
  }
}

async function removeGear(id) {
  const prev = gear;
  gear = gear.filter((g) => g.id !== id);
  render();
  try {
    const res = await db("DELETE FROM app_kids_activities__gear WHERE id = ?", [id]);
    if (res.changed === 0) { const e = await staleWrite(() => gear.some((g) => g.id === id)); console.error(e); showError(failureLine(e, { action: "remove that", thing: "gear item" })); }
  }
  catch (e) { console.error(e); gear = prev; showError(failureLine(e, { action: "remove that", thing: "gear item" })); }
}

/* ── Rendering ─────────────────────────────────────────────────────────────── */
function activityById(id) { return activities.find((a) => a.id === id); }

function renderSession(s, showActivity) {
  const kind = sessionKindMeta(s.kind);
  const act = activityById(s.activity_id);
  const where = s.location || act?.location || "";
  return `
    <div class="row" data-testid="session-row" data-session-id="${esc(s.id)}">
      <div class="row-icon" aria-hidden="true">${showActivity && act?.emoji ? esc(act.emoji) : glyph(kind.glyph)}</div>
      <div class="row-body">
        <div class="row-title">
          ${showActivity && act ? `${esc(act.name)} — ` : ""}${esc(kind.label)}
          ${s.kind === "game" ? `<span class="pill game">Game</span>` : ""}
        </div>
        <div class="row-meta">
          ${esc(fmtTimeRange(s.start_time, s.end_time))}${where ? ` · ${esc(where)}` : ""}${s.notes ? ` · ${esc(s.notes)}` : ""}
        </div>
      </div>
      <div class="row-side">
        <span class="pill ${s._days === 0 ? "today" : s._days < 7 ? "week" : ""}">${esc(sessionDayLabel(s.session_date))}</span>
        ${canManage() ? `<button class="edit-link" data-edit-session="${esc(s.id)}" data-testid="session-edit" data-session-id="${esc(s.id)}">Edit</button>` : ""}
      </div>
    </div>`;
}

// The whole shell is rendered at once, so re-render and put the caret back.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");
  if (next) { next.focus(); next.setSelectionRange(caret, caret); }
});

function render() {
  const root = document.getElementById("root");
  root.className = "app-root";
  const acts = sortedActivities(activities);

  // Nothing was read: no "No activities yet", and nothing to add onto.
  if (loadFailed) {
    root.innerHTML = `
      <div class="topbar"><h1>${glyph("ball")} Kids' Activities</h1></div>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load activities.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }

  if (!acts.length) {
    root.innerHTML = `
      <div class="topbar"><h1>${glyph("ball")} Kids' Activities</h1></div>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}
      <div class="card empty">
        <div>${chickadee("nest", { size: 72 })}</div>
        No activities yet.${canManage() ? "" : " Ask an adult to set up the season."}
        ${canManage() ? `<div style="margin-top:12px"><button class="btn" data-add-activity>+ Add an activity</button></div>` : ""}
      </div>`;
    return;
  }

  // A search narrows which activities' sessions are in view; with no search it
  // stays on the selected tab exactly as before.
  const matched = searchQ ? acts.filter((a) => searchMatch(searchQ, searchableFields(a))) : acts;
  const filterIds = searchQ
    ? new Set(matched.map((a) => a.id))
    : (currentActivityId === "all" ? null : new Set([currentActivityId]));
  const upcoming = upcomingSessions(sessions, new Date(), filterIds);
  const current = currentActivityId === "all" ? null : activityById(currentActivityId);
  const currentGear = current ? gear.filter((g) => g.activity_id === current.id) : [];

  root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>${glyph("ball")} Kids' Activities</h1>
        <p class="muted tiny">Practices, games, and what to bring.</p>
      </div>
      ${canManage() ? `<button class="btn" data-add-session data-testid="add-session">+ Session</button>` : ""}
    </div>
    <div class="tabs">
      <button class="tab ${currentActivityId === "all" ? "active" : ""}" data-tab="all">All</button>
      ${acts.map((a) => `<button class="tab ${a.id === currentActivityId ? "active" : ""}" data-tab="${esc(a.id)}" data-testid="activity-tab" data-activity-id="${esc(a.id)}">${esc(a.emoji)} ${esc(a.name)}</button>`).join("")}
      ${canManage() ? `<button class="tab" data-add-activity>+ Activity</button>` : ""}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${acts.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search activities…" aria-label="Search activities" value="${esc(searchQ)}" /></div>` : ""}
    ${current && !searchQ ? `
      <div class="card" style="margin-bottom:12px" data-testid="activity-detail" data-activity-id="${esc(current.id)}">
        <div class="row-title">${esc(current.emoji)} ${esc(current.name)} <span class="muted tiny">· ${esc(memberName(current.member_id))}${current.season ? ` · ${esc(current.season)}` : ""}</span></div>
        <div class="row-meta">
          ${current.location ? `${glyph("location")} ${esc(current.location)} · ` : ""}
          ${current.coach_name ? `${esc(current.coach_name)}${current.coach_contact ? ` (${esc(current.coach_contact)})` : ""}` : ""}
        </div>
        ${current.notes ? `<div class="row-meta">${esc(current.notes)}</div>` : ""}
        <div class="section-head" style="margin:12px 0 6px"><h2>Gear checklist</h2></div>
        <div class="gear-list">
          ${currentGear.map((g) => `<span class="gear-chip" data-testid="gear-chip" data-gear-id="${esc(g.id)}">${esc(g.name)}${canManage() ? `<button data-remove-gear="${esc(g.id)}" title="Remove" aria-label="Remove" data-testid="gear-remove" data-gear-id="${esc(g.id)}">${glyph("close")}</button>` : ""}</span>`).join("")}
          ${!currentGear.length ? `<span class="muted tiny">Nothing listed yet.</span>` : ""}
        </div>
        ${canManage() ? `
          <form class="inline-add" id="gear-form" style="margin-top:10px">
            <input id="gear-name" placeholder="Add gear (shin guards, water bottle…)" />
            <button type="submit" class="btn btn-ghost btn-sm">Add</button>
          </form>` : ""}
        ${canManage() || CAN_SHARE ? `<div style="margin-top:10px">
          ${canManage() ? `<button class="edit-link" data-edit-activity="${esc(current.id)}">Edit activity</button>` : ""}
          ${CAN_SHARE ? `<button class="edit-link" data-share-activity="${esc(current.id)}" data-testid="activity-share">Share</button>` : ""}
        </div>` : ""}
      </div>` : ""}
    <div class="section-head"><h2>Coming up</h2></div>
    ${upcoming.length
      ? `<div class="stack">${upcoming.map((s) => renderSession(s, currentActivityId === "all")).join("")}</div>`
      : `<div class="card empty tiny">${searchQ ? `No sessions for activities matching "${esc(searchQ)}".` : `No upcoming sessions${canManage() ? " — add one with + Session" : ""}.`}</div>`}
  `;

  document.getElementById("gear-form")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("gear-name");
    const name = input.value.trim();
    if (!name || !current) return;
    input.value = "";
    addGear(current.id, name).catch((err) => { console.error(err); showError(failureLine(err, { action: "add that", thing: "gear item" })); });
  });
}

/* ── Modals ────────────────────────────────────────────────────────────────── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function submitBtnBusy(busy = true) {
  const btn = modalEl?.querySelector('button[type="submit"]');
  if (!btn) return;
  if (busy) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = "Saving…"; }
  else { btn.disabled = false; btn.textContent = btn.dataset.label ?? "Save"; }
}

// A refused save: the form is still open as typed, so say it there and give
// the button back.
function saveFailed(words) {
  return (e) => {
    console.error(e);
    submitBtnBusy(false);
    formError(failureLine(e, words));
  };
}

// The open form's own error line, above its buttons: the page's error line is
// drawn behind the dialog, where nobody filling the form in can read it.
function formError(msg) {
  const actions = modalEl?.querySelector(".modal-actions");
  if (!actions) { showError(msg); return; }
  let line = modalEl.querySelector(".error");
  if (!line) {
    line = document.createElement("div");
    line.className = "error";
    line.setAttribute("role", "alert");
    actions.before(line);
  }
  line.textContent = msg;
}

function openActivityEditor(existing) {
  const a = existing ?? null;
  const kidOptions = members.map((m) => `<option value="${esc(m.id)}" ${a?.member_id === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("");
  openModal(`
    <h2>${a ? "Edit activity" : "Add activity"}</h2>
    <form class="form" id="activity-form">
      <div class="grid2">
        <div class="field"><label for="a-name">Activity</label><input id="a-name" data-autofocus value="${esc(a?.name ?? "")}" placeholder="U10 Soccer" required /></div>
        <div class="field"><label for="a-kid">Whose</label><select id="a-kid">${kidOptions}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="a-emoji">Emoji</label><input id="a-emoji" value="${esc(a?.emoji ?? "⚽")}" maxlength="4" /></div>
        <div class="field"><label for="a-season">Season</label><input id="a-season" value="${esc(a?.season ?? "")}" placeholder="Fall 2026" /></div>
      </div>
      <div class="field"><label for="a-location">Usual location</label><input id="a-location" value="${esc(a?.location ?? "")}" placeholder="Miller Park" /></div>
      <div class="grid2">
        <div class="field"><label for="a-coach">Coach / teacher</label><input id="a-coach" value="${esc(a?.coach_name ?? "")}" /></div>
        <div class="field"><label for="a-contact">Contact</label><input id="a-contact" value="${esc(a?.coach_contact ?? "")}" placeholder="phone or email" /></div>
      </div>
      <div class="field"><label for="a-notes">Notes</label><textarea id="a-notes">${esc(a?.notes ?? "")}</textarea></div>
      <div class="modal-actions">
        ${a ? `<button type="button" class="btn btn-danger modal-left" data-archive-activity="${esc(a.id)}">Archive</button>` : ""}
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${a ? "Save" : "Add"}</button>
      </div>
    </form>`);
  modalEl.querySelector("[data-autofocus]")?.focus();
  modalEl.querySelector("#activity-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("a-name").value.trim();
    if (!name) { document.getElementById("a-name").focus(); return; }
    modalEl.querySelector(".error")?.remove();
    submitBtnBusy();
    saveActivity({
      member_id: document.getElementById("a-kid").value,
      name,
      season: document.getElementById("a-season").value.trim(),
      location: document.getElementById("a-location").value.trim(),
      coach_name: document.getElementById("a-coach").value.trim(),
      coach_contact: document.getElementById("a-contact").value.trim(),
      notes: document.getElementById("a-notes").value.trim(),
      emoji: document.getElementById("a-emoji").value.trim() || "⚽",
    }, a?.id ?? null, e.currentTarget.dataset).catch(saveFailed({ action: "save the activity", thing: "activity" }));
  });
}

function openSessionEditor(existing) {
  const s = existing ?? null;
  const acts = sortedActivities(activities);
  const defaultActivity = s?.activity_id ?? (currentActivityId !== "all" ? currentActivityId : acts[0]?.id);
  const actOptions = acts.map((a) => `<option value="${esc(a.id)}" ${defaultActivity === a.id ? "selected" : ""}>${esc(a.emoji)} ${esc(a.name)}</option>`).join("");
  const kindOptions = SESSION_KINDS.map((k) => `<option value="${k.value}" ${(s?.kind ?? "practice") === k.value ? "selected" : ""}>${k.label}</option>`).join("");
  openModal(`
    <h2>${s ? "Edit session" : "Add session"}</h2>
    <form class="form" id="session-form">
      <div class="grid2">
        <div class="field"><label for="s-activity">Activity</label><select id="s-activity">${actOptions}</select></div>
        <div class="field"><label for="s-kind">Type</label><select id="s-kind">${kindOptions}</select></div>
      </div>
      <div class="field"><label for="s-date">Date</label><input id="s-date" type="date" value="${esc(s?.session_date ?? "")}" required /></div>
      <div class="grid2">
        <div class="field"><label for="s-start">Starts</label><input id="s-start" type="time" value="${esc(s?.start_time ?? "")}" /></div>
        <div class="field"><label for="s-end">Ends</label><input id="s-end" type="time" value="${esc(s?.end_time ?? "")}" /></div>
      </div>
      <div class="field"><label for="s-location">Location <span class="muted" style="text-transform:none">(blank = usual)</span></label><input id="s-location" value="${esc(s?.location ?? "")}" /></div>
      <div class="field"><label for="s-notes">Notes</label><textarea id="s-notes">${esc(s?.notes ?? "")}</textarea></div>
      <div class="modal-actions">
        ${s ? `<button type="button" class="btn btn-danger modal-left" data-delete-session="${esc(s.id)}">Delete</button>` : ""}
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${s ? "Save" : "Add"}</button>
      </div>
    </form>`);
  modalEl.querySelector("#session-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = document.getElementById("s-date").value;
    if (!date) { document.getElementById("s-date").focus(); return; }
    const start = document.getElementById("s-start").value;
    const end = document.getElementById("s-end").value;
    if (start && end && end < start) { formError("End time is before start time."); return; }
    modalEl.querySelector(".error")?.remove();
    submitBtnBusy();
    saveSession({
      activity_id: document.getElementById("s-activity").value,
      kind: document.getElementById("s-kind").value,
      session_date: date,
      start_time: start,
      end_time: end,
      location: document.getElementById("s-location").value.trim(),
      notes: document.getElementById("s-notes").value.trim(),
    }, s?.id ?? null, e.currentTarget.dataset).catch(saveFailed({ action: "save the session", thing: "session" }));
  });
}

/* ── Events ────────────────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.matches('[data-testid="load-retry"]')) { refresh(); return; }
  if (t.hasAttribute("data-tab")) { currentActivityId = t.getAttribute("data-tab"); render(); return; }
  if (t.hasAttribute("data-cancel")) { closeModal(); return; }
  if (t.hasAttribute("data-add-activity")) { openActivityEditor(null); return; }
  if (t.hasAttribute("data-edit-activity")) { openActivityEditor(activities.find((a) => a.id === t.getAttribute("data-edit-activity"))); return; }
  if (t.hasAttribute("data-share-activity")) {
    const a = activityById(t.getAttribute("data-share-activity"));
    if (a) shareUi.open({ id: a.id, title: a.name });
    return;
  }
  if (t.hasAttribute("data-archive-activity")) { archiveActivity(t.getAttribute("data-archive-activity")); return; }
  if (t.hasAttribute("data-add-session")) { openSessionEditor(null); return; }
  if (t.hasAttribute("data-edit-session")) { openSessionEditor(sessions.find((s) => s.id === t.getAttribute("data-edit-session"))); return; }
  if (t.hasAttribute("data-delete-session")) { deleteSession(t.getAttribute("data-delete-session")); return; }
  if (t.hasAttribute("data-remove-gear")) { removeGear(t.getAttribute("data-remove-gear")).catch((err) => { console.error(err); showError(failureLine(err, { action: "remove that", thing: "gear item" })); }); return; }
});

refresh();
</script>
</body>
</html>
